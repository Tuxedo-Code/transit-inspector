name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs (Dependabot keeps them and the version comments current).
# The check job has no secrets: Dependabot PRs run new dependency code in it.
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/puppeteer
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # Registry signatures and provenance of every installed package.
      - run: npm audit signatures
      # Known vulnerabilities in code that ships block the release; dev-only advisories come as Dependabot alerts.
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Ubuntu 24.04 blocks the user namespaces Chrome's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The real-DevTools tests need a headed browser, so give Chrome a virtual display.
      - run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore

  # Keeps the release PR up to date. When that PR is merged, tags the release and attaches the zip.
  # Build and upload live in this job because tags pushed with GITHUB_TOKEN don't trigger other workflows.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      # Build provenance attestation for the zip.
      id-token: write
      attestations: write
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - if: steps.release.outputs.release_created
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.release.outputs.release_created
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - if: steps.release.outputs.release_created
        run: npm ci && npm run package
      - if: steps.release.outputs.release_created
        run: gh release upload "$TAG" "transit-inspector-$VERSION.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
      # After the upload, so a failure here can't leave a release without its zip.
      # Verify with: gh attestation verify transit-inspector-<version>.zip -R Tuxedo-Code/transit-inspector
      - if: steps.release.outputs.release_created
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: transit-inspector-${{ steps.release.outputs.version }}.zip
